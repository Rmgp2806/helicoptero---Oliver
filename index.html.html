<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Helicopter Dodge</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
            user-select: none;
        }

        #wrapper {
            position: relative;
            width: 400px;
            height: 600px;
        }

        canvas {
            width: 400px;
            height: 600px;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(140, 230, 255, 0.3);
            cursor: pointer;
            display: block;
        }

        #hint {
            position: absolute;
            bottom: -36px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-size: 13px;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div id="wrapper">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="hint">Click / Tap para saltar · Flechas ↑↓ también funcionan</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ─── Constantes ───────────────────────────────────────────────
    const W = canvas.width;
    const H = canvas.height;
    const GRAVITY       = 0.45;
    const JUMP_FORCE    = -9;
    const SPAWN_MIN     = 55;   // frames mínimos entre spawns
    const SPEED_BASE    = 3.5;
    const SPEED_RAMP    = 0.0015; // cuánto aumenta la velocidad con el tiempo

    // ─── Estado global ─────────────────────────────────────────────
    let frames, score, gameOver, started, highScore;
    let helicopters, particles;
    let spawnCooldown;

    // ─── Jugador ───────────────────────────────────────────────────
    const player = {
        x: 50, y: 280,
        w: 44, h: 40,
        dy: 0,
        alive: true,
        shake: 0,

        reset() {
            this.x = 50; this.y = 280;
            this.dy = 0; this.alive = true; this.shake = 0;
        },

        jump() {
            if (!this.alive) return;
            this.dy = JUMP_FORCE;
        },

        update() {
            if (!this.alive) return;
            this.dy += GRAVITY;
            this.y += this.dy;
            if (this.y < 0)          { this.y = 0;      this.dy = 0; }
            if (this.y + this.h > H) { this.y = H - this.h; this.dy = 0; }
            if (this.shake > 0) this.shake--;
        },

        draw() {
            const ox = this.shake > 0 ? (Math.random() - 0.5) * 6 : 0;
            const oy = this.shake > 0 ? (Math.random() - 0.5) * 6 : 0;
            const cx = this.x + ox + this.w / 2;
            const cy = this.y + oy + this.h / 2;
            const r = this.h / 2;
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(playerImg, this.x + ox, this.y + oy, this.w, this.h);
            ctx.restore();
        },

        hitbox() {
            // hitbox reducida para ser más justa
            return { x: this.x + 8, y: this.y + 8, w: this.w - 14, h: this.h - 14 };
        }
    };

    // ─── Helicópteros ──────────────────────────────────────────────
    function spawnHelicopter() {
        const margin = 60;
        helicopters.push({
            x: W + 20,
            y: margin + Math.random() * (H - margin * 2 - 44),
            w: 54, h: 40,
            speed: SPEED_BASE + frames * SPEED_RAMP + Math.random() * 2.5,
            passed: false
        });
    }

    function updateHelicopters() {
        spawnCooldown--;
        if (spawnCooldown <= 0) {
            spawnHelicopter();
            // más seguido a medida que pasa el tiempo
            spawnCooldown = Math.max(28, SPAWN_MIN - Math.floor(frames / 120));
        }

        for (let i = helicopters.length - 1; i >= 0; i--) {
            const h = helicopters[i];
            h.x -= h.speed;

            // colisión
            if (!h.passed) {
                const p = player.hitbox();
                const hb = { x: h.x + 8, y: h.y + 8, w: h.w - 14, h: h.h - 14 };
                if (p.x < hb.x + hb.w && p.x + p.w > hb.x &&
                    p.y < hb.y + hb.h && p.y + p.h > hb.y) {
                    triggerDeath();
                }
            }

            // esquivado con éxito
            if (!h.passed && h.x + h.w < player.x) {
                h.passed = true;
                score++;
                spawnScoreParticle();
            }

            if (h.x + h.w < -20) helicopters.splice(i, 1);
        }
    }

    function drawHelicopters() {
        ctx.font = '44px Arial';
        for (const h of helicopters) {
            ctx.fillText('🚁', h.x, h.y + h.h);
        }
    }

    // ─── Partículas de puntos ──────────────────────────────────────
    function spawnScoreParticle() {
        particles.push({
            x: player.x + player.w + 10,
            y: player.y,
            text: '+1',
            life: 40,
            dy: -1.2
        });
    }

    function updateDrawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.y += p.dy;
            p.life--;
            const alpha = p.life / 40;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#00e676';
            ctx.font = 'bold 18px Segoe UI';
            ctx.fillText(p.text, p.x, p.y);
            ctx.globalAlpha = 1;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // ─── Muerte ────────────────────────────────────────────────────
    function triggerDeath() {
        if (!player.alive) return;
        player.alive = false;
        player.shake = 15;
        if (score > highScore) highScore = score;
        gameOver = true;
    }

    // ─── HUD ───────────────────────────────────────────────────────
    function drawHUD() {
        // Score
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.roundRect(10, 10, 130, 38, 10);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px Segoe UI';
        ctx.fillText('Score: ' + score, 20, 34);

        // High score (esquina derecha)
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.roundRect(W - 145, 10, 135, 38, 10);
        ctx.fill();
        ctx.fillStyle = '#ffe082';
        ctx.font = 'bold 16px Segoe UI';
        ctx.fillText('Mejor: ' + highScore, W - 132, 34);

        // Velocidad (pequeño indicator)
        const speed = (SPEED_BASE + frames * SPEED_RAMP).toFixed(1);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.roundRect(W / 2 - 50, 10, 100, 38, 10);
        ctx.fill();
        ctx.fillStyle = '#80d8ff';
        ctx.font = 'bold 14px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('⚡ x' + speed, W / 2, 34);
        ctx.textAlign = 'left';
    }

    // ─── Pantalla de inicio ────────────────────────────────────────
    function drawStart() {
        // Fondo
        ctx.fillStyle = '#8ce6ff';
        ctx.fillRect(0, 0, W, H);

        // Título
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, 0, W, 70);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('Gng who made Ts game 😭🌹', W / 2, 44);
        ctx.textAlign = 'left';

        // Personaje grande
        // Big portrait on start screen
        ctx.save();
        ctx.beginPath();
        ctx.arc(W / 2, H / 2 - 70, 60, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(playerImg, W / 2 - 60, H / 2 - 130, 120, 120);
        ctx.restore();

        // Instrucciones
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.roundRect(60, H / 2 + 10, W - 120, 110, 14);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 22px Segoe UI';
        ctx.fillText('TAP / CLICK para saltar', W / 2, H / 2 + 40);
        ctx.font = '16px Segoe UI';
        ctx.fillStyle = '#caf0ff';
        ctx.fillText('Esquiva los helicópteros 🚁', W / 2, H / 2 + 68);
        ctx.fillText('Cada uno que pases = +1 punto', W / 2, H / 2 + 92);
        ctx.fillText('↑↓ también funcionan', W / 2, H / 2 + 112);

        ctx.textAlign = 'left';

        // Pulso "toca para empezar"
        const pulse = 0.85 + 0.15 * Math.sin(frames * 0.08);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = '#003366';
        ctx.textAlign = 'center';
        ctx.font = 'bold 18px Segoe UI';
        ctx.fillText('▶  Toca para empezar', W / 2, H - 50);
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
    }

    // ─── Pantalla Game Over ────────────────────────────────────────
    function drawGameOver() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'center';

        ctx.font = 'bold 48px Segoe UI';
        ctx.fillStyle = '#ff5252';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 80);

        ctx.font = 'bold 26px Segoe UI';
        ctx.fillStyle = '#fff';
        ctx.fillText('Puntaje: ' + score, W / 2, H / 2 - 30);

        if (score === highScore && score > 0) {
            ctx.fillStyle = '#ffe082';
            ctx.font = 'bold 20px Segoe UI';
            ctx.fillText('🏆 ¡Nuevo récord!', W / 2, H / 2 + 10);
        } else {
            ctx.fillStyle = '#aaa';
            ctx.font = '18px Segoe UI';
            ctx.fillText('Mejor: ' + highScore, W / 2, H / 2 + 10);
        }

        // Botón reiniciar
        ctx.fillStyle = '#00b0ff';
        ctx.beginPath();
        ctx.roundRect(W / 2 - 110, H / 2 + 50, 220, 56, 14);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Segoe UI';
        ctx.fillText('🔄 Reiniciar', W / 2, H / 2 + 84);

        ctx.textAlign = 'left';
    }

    // ─── Reset ─────────────────────────────────────────────────────
    function reset() {
        frames = 0;
        score = 0;
        gameOver = false;
        helicopters = [];
        particles = [];
        spawnCooldown = 60;
        player.reset();
    }

    // ─── Controles ─────────────────────────────────────────────────
    function handleJump() {
        if (!started) { started = true; reset(); return; }
        if (gameOver) { reset(); gameOver = false; return; }
        player.jump();
    }

    // Teclado
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp' || e.key === ' ') { e.preventDefault(); handleJump(); }
        if (e.key === 'ArrowDown') {
            if (!started || gameOver) return;
            player.dy = 9; // bajar rápido
        }
    });

    // Click / Touch
    canvas.addEventListener('pointerdown', e => {
        e.preventDefault();
        handleJump();
    });

    // Pre-load player image
    const playerImg = new Image();

        // ─── Game Loop ─────────────────────────────────────────────────
    function drawBackground() {
        ctx.fillStyle = '#8ce6ff';
        ctx.fillRect(0, 0, W, H);

        // Nubes decorativas suaves
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        const cloudOffset = (frames * 0.4) % (W + 120);
        drawCloud(W + 60 - cloudOffset, 80, 80);
        drawCloud(W + 60 - cloudOffset + 250, 160, 55);
        drawCloud(W + 60 - cloudOffset + 480, 60, 70);
        drawCloud(W + 60 - cloudOffset - 160, 220, 45);
    }

    function drawCloud(x, y, r) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.arc(x + r * 0.8, y - r * 0.3, r * 0.7, 0, Math.PI * 2);
        ctx.arc(x - r * 0.8, y - r * 0.2, r * 0.65, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop() {
        frames++;

        if (!started) {
            drawStart();
            requestAnimationFrame(loop);
            return;
        }

        drawBackground();

        if (!gameOver) {
            player.update();
            updateHelicopters();
        }

        drawHelicopters();
        player.draw();
        updateDrawParticles();

        if (!gameOver) drawHUD();
        else drawGameOver();

        requestAnimationFrame(loop);
    }

    // ─── Iniciar ───────────────────────────────────────────────────
    highScore = 0;
    started = false;
    frames = 0;
    helicopters = [];
    particles = [];
    spawnCooldown = 60;

    loop();
</script>
